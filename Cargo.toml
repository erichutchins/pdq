[package]
name = "pdq"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pdq"
path = "bin/pdq.rs"

[dependencies]
arrow = "55.2.0"
async-trait = "0.1"
clap = "4.0"
datafusion = { features = [
    "backtrace",
], git = "https://github.com/apache/datafusion.git" }
datafusion-expr = { git = "https://github.com/apache/datafusion.git" }
datafusion-optimizer = { git = "https://github.com/apache/datafusion.git" }
datafusion-common = { git = "https://github.com/apache/datafusion.git" }
datafusion-physical-expr = { git = "https://github.com/apache/datafusion.git" }
datafusion-sql = { git = "https://github.com/apache/datafusion.git" }
fst = "0.4.7"
parquet = "55.2.0"
rayon = "1.8"
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "fs"] }
walkdir = "2.5"
memmap2 = "0.9"
futures = "0.3"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
