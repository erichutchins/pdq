[package]
name = "pdq"
version = "0.1.0"
edition = "2021"

# Add PyO3 configuration for Python bindings
[lib]
name = "pdq"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pdq"
path = "src/bin/pdq.rs"


[dependencies]
arrow = "55.2.0"
async-trait = "0.1"
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.10"
fst = "0.4.7"
rayon = "1.10"
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "fs"] }
# PyO3 dependencies for Python bindings
pyo3 = { version = "0.25.1", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.25", features = ["tokio-runtime"] }
pyo3-async-runtimes-macros = { version = "0.25" }
datafusion = { default-features = false, features = [
    "parquet",
], version = "49.0.0" }
# ], git = "https://github.com/apache/datafusion.git", rev = "de8cbd0ab606bec6eb3ea082fa61f09aa16874eb" }
# For Polars integration
polars = { version = "0.49.1", features = ["lazy", "parquet", "ipc"] }
walkdir = "2.5"
memmap2 = "0.9"
futures = "0.3"
parquet = { version = "55.2.0", default-features = false, features = [
    "arrow",
    "async",
    "object_store",
    "encryption",
    "snap",
    "flate2",
    "zstd",
    "lz4",
    "brotli",
] }
object_store = "0.12"
bytes = "1.10"
anyhow = "1.0.98"
tracing = "0.1.41"


[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"


# Python-specific build configuration
[package.metadata.maturin]
name = "pdq"
python-source = "python"
