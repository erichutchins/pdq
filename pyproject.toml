[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[project]
name = "pdq"
dynamic = ["version"]
description = "Fast Parquet Data Query using FST-based index"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[tool.maturin]
python-source = "python"
module-name = "pdq.pdq"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["ruff>=0.12.1", "uv>=0.7.17"]
