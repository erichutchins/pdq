[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[project]
name = "pdq"
dynamic = ["version"]
description = "Fast Parquet Data Query using FST-based indices"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["narwhals>=2.1.2"]

[dependency-groups]
dev = ["ruff>=0.12.1", "uv>=0.7.17"]

[project.optional-dependencies]
# Users can pick their preferred dataframe backend
pandas = ["pandas>=1.1.3"]
polars = ["polars>=0.20.4"]

[tool.maturin]
python-source = "python"
module-name = "pdq.pdq"
features = ["pyo3/extension-module"]
# Require Cargo.lock is up to date
include = [
    { path = "Cargo.lock", format = "sdist" },
    { path = "Cargo.toml", format = "sdist" },
]
locked = true
manifest-path = "Cargo.toml"
profile = "dev"

[tool.ruff]
line-length = 90
fix = true
target-version = "py39"
